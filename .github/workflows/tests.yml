name: Tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -c requirements.lock -e '.[dev,postgres,mcp]'
      - run: python -m ruff check membridge tests scripts/verify_http.py
      - run: python -m pytest -q
      - run: python scripts/verify_http.py
