[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "membridge"
version = "0.1.0"
description = "Portable project memory and handoffs across AI tools"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2,<3",
  "httpx>=0.28,<1", "typer>=0.15,<1", "pydantic>=2.9,<3",
]

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]
postgres = ["psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pyyaml>=6,<7"]

[project.scripts]
membridge = "membridge.cli:app"

[tool.setuptools.packages.find]
include = ["membridge*"]

[tool.setuptools.package-data]
membridge = ["web/*.html", "web/*.js", "web/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
