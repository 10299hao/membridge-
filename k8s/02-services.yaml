apiVersion: apps/v1
kind: Deployment
metadata: {name: ingestion, namespace: membridge}
spec:
  replicas: 1
  selector:
    matchLabels: {app: ingestion}
  template:
    metadata:
      labels: {app: ingestion}
    spec:
      containers:
        - name: ingestion
          image: membridge:local
          imagePullPolicy: IfNotPresent
          args: [serve, ingestion, --host, 0.0.0.0]
          command: ["/usr/local/bin/membridge"]
          envFrom: [{secretRef: {name: membridge-secrets}}]
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health/ready, port: 8000}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: 8000}, initialDelaySeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata: {name: ingestion, namespace: membridge}
spec:
  selector: {app: ingestion}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ai, namespace: membridge}
spec:
  replicas: 1
  selector:
    matchLabels: {app: ai}
  template:
    metadata:
      labels: {app: ai}
    spec:
      containers:
        - name: ai
          image: membridge:local
          imagePullPolicy: IfNotPresent
          command: [membridge, serve, ai, --host, 0.0.0.0]
          envFrom: [{secretRef: {name: membridge-secrets}}]
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health/ready, port: 8000}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: 8000}, initialDelaySeconds: 10}
          resources:
            requests: {cpu: 200m, memory: 128Mi}
            limits: {cpu: '2', memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata: {name: ai, namespace: membridge}
spec:
  selector: {app: ai}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway, namespace: membridge}
spec:
  replicas: 1
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      containers:
        - name: gateway
          image: membridge:local
          imagePullPolicy: IfNotPresent
          envFrom: [{secretRef: {name: membridge-secrets}}]
          env:
            - name: MEMBRIDGE_DATABASE_URL
              value: postgresql+psycopg://membridge:$(POSTGRES_PASSWORD)@postgres:5432/membridge
            - {name: MEMBRIDGE_INGESTION_URL, value: 'http://ingestion:8000'}
            - {name: MEMBRIDGE_AI_URL, value: 'http://ai:8000'}
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health/ready, port: 8000}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: 8000}, initialDelaySeconds: 15}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata: {name: gateway, namespace: membridge}
spec:
  selector: {app: gateway}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: membridge}
spec:
  replicas: 1
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      containers:
        - name: worker
          image: membridge:local
          imagePullPolicy: IfNotPresent
          command: [membridge, worker]
          envFrom: [{secretRef: {name: membridge-secrets}}]
          env:
            - name: MEMBRIDGE_DATABASE_URL
              value: postgresql+psycopg://membridge:$(POSTGRES_PASSWORD)@postgres:5432/membridge
            - {name: MEMBRIDGE_AI_URL, value: 'http://ai:8000'}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
